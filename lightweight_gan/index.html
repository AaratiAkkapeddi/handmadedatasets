<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAN Generator</title>
<link rel="stylesheet" href="./styles.css">

</head>
<body>
<main>
  <h1>GAN Generator</h1>
  <p class="sub">Load an ONNX generator model, then press generate.</p>

  <div class="panel">
    <label for="modelFile">ONNX model file</label>
    <input type="file" id="modelFile" accept=".onnx">
  </div>

  <div class="panel">
    <div class="row">
   
    </div>
    <button id="genBtn" disabled>Generate image</button>
    <div id="status">Load a model to begin.</div>
  </div>

  <div class="canvas-wrap">
    <canvas id="output" width="64" height="64" style="display:none;"></canvas>
    <span class="placeholder" id="placeholderText">No image yet</span>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
<script src="./main.js"></script>

</body>
</html>
