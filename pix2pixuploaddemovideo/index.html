<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Pix2Pix web demo</title>

  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.13/lib/p5.js"></script>
  <script src="https://unpkg.com/ml5@0.1.1/dist/ml5.min.js" type="text/javascript"></script>
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="style.css">
  <style>
    /* Soft-disabled state: stays clickable so the status text can explain
       what's missing, but looks visually inactive. */
    #videoTransferBtn.is-disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>

</head>

<body>
  <main>
    <p>This html demo of pix2pix is slightly modified from Dongphil Yoo's <a href="https://github.com/dongphilyoo/pix2pix-ml5-demo">pix2pix-ml5-demo</a></p>
    <p id="status" role="status" aria-live="polite">Upload a .pict model file to begin.</p>

    <div id="uploads" role="group" aria-label="File uploads">
      <label for="modelFileInput">
        Model file (.pict):
        <input type="file" id="modelFileInput" accept=".pict" aria-describedby="status">
      </label>
      <label for="imageFileInput">

        <input type="file" id="imageFileInput" accept="image/*">
      </label>
      <label for="videoFileInput">
        Input video (optional):
        <input type="file" id="videoFileInput" accept="video/*">
      </label>
    </div>

    <div id="app">
      <div id="input"
           role="img"
           aria-label="Drawing canvas. Use a mouse or touch to draw a face using white lines on a black background. Sketch eyebrows, eyes, a nose, and a mouth as simple outlines, or upload your own image above.">
      </div>
      <img id="output"
           src="images/blank.png"
           alt="The AI-generated output will appear here after clicking Transfer."
           aria-live="polite">
    </div>

    <div id="buttons" role="group" aria-label="Canvas controls">
      <button id="clearBtn" aria-label="Clear the canvas and start over">Clear</button>
      <button id="transferBtn" aria-label="Run the pix2pix model and generate an image from your drawing" disabled>Transfer</button>
    </div>

    <div id="video-app" role="group" aria-label="Video transfer">
      <button id="videoTransferBtn" class="is-disabled" aria-label="Run the pix2pix model on each frame of the uploaded video and stitch the results back into a video">Transfer Video</button>
      <p id="videoStatus" role="status" aria-live="polite"></p>
      <video id="videoOutput"
             controls
             aria-label="AI-generated video produced by running each frame of your uploaded video through the model."
             style="display:none; max-width: 512px;">
      </video>
    </div>
  </main>

  <script src="./app.js"></script>
</body>

</html>
